[project]
name = "atomforge-template"
version = "0.1.0"
description = "Template for an atomforge model plugin: a Lennard-Jones potential in PyTorch."
readme = "README.md"
requires-python = ">=3.12"
# Host-side dependencies only. The model's own dependencies (here torch) are NOT
# listed here. They belong in the environment factory (environment.py) and are
# installed only in the isolated worker environment.
dependencies = [
    "atomforge-core>=0.1.0a1",
]

# One entry point per model. The target must be a ModelManifest.
[project.entry-points.'atomforge.model']
torch_lj = "atomforge_template.manifest:torch_lj_manifest"

[dependency-groups]
dev = [
    "atomforge-testing[runtime,regression]>=0.1.0a1",
    "pytest>=9.0.3",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on deprecation warnings, so that use of a deprecated atomforge API shows up
# while the old API still works. Relax this if a third-party dependency warns.
filterwarnings = ["error::DeprecationWarning"]

# Where atomforge comes from.
# Pinned to atomforge commit 71d15f41273e, which this template was exported
# from. Move all of them together to a newer commit to update atomforge.
[tool.uv.sources]
atomforge = { git = "https://github.com/atomfg/atomforge", rev = "71d15f41273ee6df8639f55df3d480ea2b7afa44" }
atomforge_core = { git = "https://github.com/atomfg/atomforge", rev = "71d15f41273ee6df8639f55df3d480ea2b7afa44", subdirectory = "packages/atomforge-core" }
atomforge_runtime = { git = "https://github.com/atomfg/atomforge", rev = "71d15f41273ee6df8639f55df3d480ea2b7afa44", subdirectory = "packages/atomforge-runtime" }
atomforge_builtins = { git = "https://github.com/atomfg/atomforge", rev = "71d15f41273ee6df8639f55df3d480ea2b7afa44", subdirectory = "packages/atomforge-builtins" }
atomforge_testing = { git = "https://github.com/atomfg/atomforge", rev = "71d15f41273ee6df8639f55df3d480ea2b7afa44", subdirectory = "packages/atomforge-testing" }
